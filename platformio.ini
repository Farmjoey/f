; NOVA RIDE OS - build configuration
; Versions are pinned so the build is reproducible.
; platform 6.9.0  -> Arduino-ESP32 core 2.0.17 (classic ESP32)
[platformio]
default_envs = cyd_st7789

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@1.4.2
; TFT_eSPI is configured fully through build flags (no User_Setup.h edit needed).
; Pin map matches the common ESP32-2432S028R family (display on HSPI, touch bit-banged).
build_flags =
    -DNOVA_FW_VERSION=\"0.4.0\"
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT8=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000

; ---- Hardware profiles -------------------------------------------------
; Try them in this order on a 2-USB (USB-C + micro-USB) board:
;   cyd_st7789  ->  cyd_st7789_swaprb  ->  cyd_ili9341  ->  cyd_ili9341_swaprb
; "swaprb" = red/blue channel order flipped (compile-time in TFT_eSPI).
; Inversion and rotation are runtime settings (INVERT / FLIP in the HW test).

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DNOVA_PROFILE_NAME=\"cyd_st7789\"
    -DNOVA_DEFAULT_INVERT=1

[env:cyd_st7789_swaprb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=0
    -DNOVA_PROFILE_NAME=\"cyd_st7789_swaprb\"
    -DNOVA_DEFAULT_INVERT=1

[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DNOVA_PROFILE_NAME=\"cyd_ili9341\"
    -DNOVA_DEFAULT_INVERT=0

[env:cyd_ili9341_swaprb]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=1
    -DNOVA_PROFILE_NAME=\"cyd_ili9341_swaprb\"
    -DNOVA_DEFAULT_INVERT=0
